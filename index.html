
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Motivation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>✨ Daily Motivation</h2>
        <p>Believe in yourself. Keep moving forward.</p>
    </header>

    <main class="container">
        <div class="quote-card">
            <div class="quote-icon">“</div>

            <p id="quote">
                Great things take time. Never stop believing in yourself.
            </p>

            <h3 id="author">— Daily Inspiration</h3>

            <div class="buttons">
                <button onclick="newQuote()">New Quote 🔄</button>
                <button class="copy-btn" onclick="copyQuote()">Copy Quote 📋</button>
            </div>
        </div>

        <p class="footer">Made with ❤️ to inspire your day.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
